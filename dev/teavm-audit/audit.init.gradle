            systemProperty 'java.awt.headless', 'true'
            systemProperty 'logback.configurationFile', new File(harness, 'logback.xml').absolutePath
            environment 'XDG_CONFIG_HOME', new File(classifierOutput, 'jvm-' + variant + '/config').absolutePath
            environment 'XDG_DATA_HOME', new File(classifierOutput, 'jvm-' + variant + '/data').absolutePath
            environment 'XDG_CACHE_HOME', new File(classifierOutput, 'jvm-' + variant + '/cache').absolutePath
            args new File(rootProject.projectDir, 'build/wasm-compat/clean-grid-probe').absolutePath,
                    new File(classifierOutput, portableModel ? 'jvm-portable.json' : 'jvm-reference.json').absolutePath,
                    new File(upstreamNeural, 'classes').absolutePath, portableModel ? 'portable' : 'original', new File(app.projectDir, 'res/basic-classifier.zip').absolutePath
        }
    }
    rootProject.tasks.register('buildClassifierProbe', JavaExec) {
        dependsOn compile, 'compileWasmCompatibilityTests', 'patchKxmlCompatibility', 'selectWasmLibraryImplementations'
        classpath = rootProject.files(compatTests) + compatRuntime
        mainClass = 'audit.CompileCompatibilityProbe'
        maxHeapSize = '2g'
        systemProperty 'audiveris.compat.enabled', 'true'
        systemProperty 'audiveris.compat.headless', 'true'
        args classifierOutput.absolutePath, 'org.audiveris.wasm.compat.test.ClassifierProbe', 'classifier'
    }
    rootProject.tasks.register('verifyClassifierProbe', Exec) {
        dependsOn 'testClassifierOriginalJvm', 'testClassifierPortableJvm', 'buildClassifierProbe'
        commandLine 'node', '--max-old-space-size=384', new File(compat, 'tools/verify-classifier.cjs').absolutePath,
                classifierOutput.absolutePath, new File(app.projectDir, 'res/basic-classifier.zip').absolutePath
    }
    def upstreamBracket = new File(rootProject.projectDir, 'build/wasm-compat/upstream-bracket')
    rootProject.tasks.register('prepareUpstreamBracket', Exec) {
        commandLine 'python3', new File(harness, 'prepare_upstream_bracket.py').absolutePath,
                rootProject.findProperty('upstreamGitRoot') ?: System.getenv('AUDIVERIS_SOURCE_ROOT') ?: rootProject.projectDir.absolutePath, upstreamBracket.absolutePath
    }
    rootProject.tasks.register('compileUpstreamBracket', JavaCompile) {
        dependsOn 'prepareUpstreamBracket', app.tasks.named('classes')
        source new File(upstreamBracket, 'src')
        classpath = app.sourceSets.main.runtimeClasspath
        destinationDirectory = new File(upstreamBracket, 'classes')
        javaCompiler = app.tasks.named('compileJava').flatMap { it.javaCompiler }
        options.release = 17; sourceCompatibility = '17'; targetCompatibility = '17'; options.encoding = 'UTF-8'
    }
    def upstreamScale = new File(rootProject.projectDir, 'build/wasm-compat/upstream-scale')
    rootProject.tasks.register('prepareUpstreamScale', Exec) {
        commandLine 'python3', new File(harness, 'prepare_upstream_scale.py').absolutePath,
                rootProject.findProperty('upstreamGitRoot') ?: System.getenv('AUDIVERIS_SOURCE_ROOT') ?: rootProject.projectDir.absolutePath, upstreamScale.absolutePath
    }
    rootProject.tasks.register('compileUpstreamScale', JavaCompile) {
        dependsOn 'prepareUpstreamScale', app.tasks.named('classes')
        source new File(upstreamScale, 'src')
        classpath = app.sourceSets.main.runtimeClasspath
        destinationDirectory = new File(upstreamScale, 'classes')
        javaCompiler = app.tasks.named('compileJava').flatMap { it.javaCompiler }
        options.release = 17; sourceCompatibility = '17'; targetCompatibility = '17'; options.encoding = 'UTF-8'
    }
    rootProject.tasks.register('testUpstreamScaleJvm', JavaExec) {
        dependsOn 'compileUpstreamScale', 'compileWasmCompatibilityTests', 'testPixelProbeJvm'
        classpath = rootProject.files(new File(upstreamScale, 'classes'), compatTests, compatClasses) + app.sourceSets.main.runtimeClasspath
        mainClass = 'org.audiveris.wasm.compat.test.OriginalScaleOracle'
        workingDir app.projectDir
        maxHeapSize = '768m'
        systemProperty 'java.awt.headless', 'true'
        systemProperty 'logback.configurationFile', new File(harness, 'logback.xml').absolutePath
        environment 'XDG_CONFIG_HOME', new File(upstreamScale, 'jvm-config').absolutePath
        environment 'XDG_DATA_HOME', new File(upstreamScale, 'jvm-data').absolutePath
        environment 'XDG_CACHE_HOME', new File(upstreamScale, 'jvm-cache').absolutePath
        args new File(pixelProbeOutput, 'samples').absolutePath, new File(upstreamScale, 'classes').absolutePath
    }
    rootProject.tasks.register('testCurrentScaleJvm', JavaExec) {
        dependsOn 'testUpstreamScaleJvm'
        classpath = rootProject.files(compatTests, compatClasses) + app.sourceSets.main.runtimeClasspath
        mainClass = 'org.audiveris.wasm.compat.test.OriginalScaleOracle'
        workingDir app.projectDir
        maxHeapSize = '768m'
        systemProperty 'java.awt.headless', 'true'
        systemProperty 'logback.configurationFile', new File(harness, 'logback.xml').absolutePath
        environment 'XDG_CONFIG_HOME', new File(upstreamScale, 'current-config').absolutePath
        environment 'XDG_DATA_HOME', new File(upstreamScale, 'current-data').absolutePath
        environment 'XDG_CACHE_HOME', new File(upstreamScale, 'current-cache').absolutePath
        args new File(pixelProbeOutput, 'samples').absolutePath, app.tasks.named('compileJava').get().destinationDirectory.get().asFile.absolutePath, 'scale-current.json'
    }
    rootProject.tasks.register('verifyWasmCompatibilityBrowser', Exec) {
        dependsOn 'verifyWasmCompatibility'
        commandLine 'node', '--max-old-space-size=256', new File(compat, 'tools/verify-browser.cjs').absolutePath, probeOutput.absolutePath
    }
    def applicationClasses = app.tasks.named('compileJava').get().destinationDirectory.get().asFile.absolutePath
    rootProject.tasks.register('inventoryTeaVMAudit', JavaExec) {
        dependsOn compile
        classpath = runtime
        mainClass = 'audit.TeaVMAudit'
        maxHeapSize = '2g'
        args applicationClasses, inventory.absolutePath, 'inventory', 'fast'
        systemProperty 'logback.configurationFile', new File(harness, 'logback.xml').absolutePath
    }
    rootProject.tasks.register('classifyTeaVMInventory', Exec) {
        dependsOn 'inventoryTeaVMAudit'
        commandLine 'python3', new File(harness, 'classify_classes.py').absolutePath,
                applicationClasses, new File(app.projectDir, 'src/main/java').absolutePath, inventory.absolutePath
    }
    rootProject.tasks.register('testTeaVMSelection', Exec) {
        workingDir harness
        commandLine 'python3', '-m', 'unittest', '-v', 'test_selection.py', 'test_compare_roots.py'
        environment 'PYTHONDONTWRITEBYTECODE', '1'
    }
    rootProject.tasks.register('prepareTeaVMSelection', Exec) {
        dependsOn 'classifyTeaVMInventory', 'testTeaVMSelection'
        commandLine 'python3', new File(harness, 'select_roots.py').absolutePath,
                inventory.absolutePath, new File(harness, 'root-policy.json').absolutePath, output.absolutePath
    }
    rootProject.tasks.register('auditTeaVM', JavaExec) {
        dependsOn compile
        if (scope == 'selected') { dependsOn 'prepareTeaVMSelection' }
        if (useCompat) { dependsOn 'copyWasmCompatibilityResources', 'verifyWasmCompatibility', 'selectWasmLibraryImplementations' }
        if (useHeadless) { dependsOn 'verifyHeadlessProbe' }
        classpath = useCompat ? compatRuntime : runtime
        mainClass = 'audit.TeaVMAudit'
        maxHeapSize = '5g'
        jvmArgs '-XX:MaxMetaspaceSize=512m', '-XX:ActiveProcessorCount=8'
        args applicationClasses, output.absolutePath, scope, mode
        if (scope == 'selected') { args new File(output, 'root-plan.tsv').absolutePath }
        systemProperty 'org.slf4j.simpleLogger.defaultLogLevel', 'warn'
        systemProperty 'logback.configurationFile', new File(harness, 'logback.xml').absolutePath
        systemProperty 'audiveris.compat.enabled', useCompat.toString()
        systemProperty 'audiveris.compat.headless', useHeadless.toString()
        if (useHeadless) { systemProperty 'audiveris.compat.headlessReport', new File(output, 'modified-methods.tsv').absolutePath }
        systemProperty 'audiveris.compat.xmlBackend', xmlBackend
    }
    if (scope == 'selected') {
        rootProject.tasks.register('classifyTeaVMClasses') { dependsOn 'auditTeaVM' }
    } else {
        rootProject.tasks.register('classifyTeaVMClasses', Exec) {
            dependsOn 'auditTeaVM'
            commandLine 'python3', new File(harness, 'classify_classes.py').absolutePath,
                    applicationClasses, new File(app.projectDir, 'src/main/java').absolutePath, output.absolutePath
        }
    }
    rootProject.tasks.register('summarizeTeaVMAudit', Exec) {
        dependsOn 'classifyTeaVMClasses'
        commandLine 'python3', new File(harness, 'summarize.py').absolutePath, output.absolutePath
    }
    rootProject.tasks.register('traceTeaVMExclusions', Exec) {
        dependsOn 'summarizeTeaVMAudit'
        doFirst {
            if (scope != 'selected') { throw new GradleException('Use -PauditScope=selected to trace exclusion paths') }
        }
        commandLine 'python3', new File(harness, 'trace_exclusions.py').absolutePath,
                output.absolutePath, inventory.absolutePath,
                new File(harness, 'results/diagnostic-summary.json').absolutePath
        if ((rootProject.findProperty('failOnExcluded') ?: 'false').toBoolean()) { args '--fail-on-excluded' }
    }
    rootProject.tasks.register('compareWasmCompatibilityAudit', Exec) {
        dependsOn 'summarizeTeaVMAudit'
        doFirst {
            if (!useCompat || scope != 'selected') { throw new GradleException('Use -PauditScope=selected -Pcompat=true; run the unpatched selected audit first') }
        }
        commandLine 'python3', new File(harness, 'compare_compat.py').absolutePath,
                new File(rootProject.projectDir, "build/teavm-audit/${mode}-selected").absolutePath, output.absolutePath
        if ((rootProject.findProperty('allowAddedRoots') ?: 'false').toBoolean()) { args '--allow-added-roots' }
    }
}

    }
    rootProject.tasks.register('buildCleanGridProbe', JavaExec) {
        dependsOn compile, 'compileWasmCompatibilityTests', 'patchKxmlCompatibility', 'selectWasmLibraryImplementations'
        classpath = rootProject.files(compatTests) + compatRuntime
        mainClass = 'audit.CompileCompatibilityProbe'
        maxHeapSize = '2g'
        systemProperty 'audiveris.compat.enabled', 'true'
        systemProperty 'audiveris.compat.headless', 'true'
        systemProperty 'audiveris.compat.reflectionClasses', 'org.audiveris.wasm.compat.test.GraphSupplierCases$PublicNode,org.audiveris.wasm.compat.test.GraphSupplierCases$HiddenNode,org.audiveris.wasm.compat.test.GraphSupplierCases$MissingNoArg,org.audiveris.wasm.compat.test.GraphSupplierCases$HiddenType'
        args new File(rootProject.projectDir, 'build/wasm-compat/clean-grid-probe').absolutePath,
                'org.audiveris.wasm.compat.test.CleanGridProbe', 'clean-grid'
    }
    rootProject.tasks.register('testCleanGridJvm', JavaExec) {

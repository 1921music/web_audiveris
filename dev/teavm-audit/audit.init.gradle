// Audits original application bytecode; optional platform substitutions live in wasm-compat.
gradle.projectsEvaluated {
    def app = rootProject.findProject(':app')
    if (app == null) { return }
    def auditDependencies = rootProject.configurations.create('teavmAuditDependencies')
    rootProject.repositories { mavenCentral() }
    rootProject.dependencies {
        teavmAuditDependencies 'org.teavm:teavm-tooling:0.16.0'
        teavmAuditDependencies 'org.teavm:teavm-classlib:0.16.0'
        teavmAuditDependencies 'org.teavm:teavm-jso:0.16.0'
        teavmAuditDependencies 'org.teavm:teavm-jso-impl:0.16.0'
    }
    def harness = new File(rootProject.projectDir, 'dev/teavm-audit')
    def classes = rootProject.layout.buildDirectory.dir('teavm-audit/classes')
    def scope = rootProject.findProperty('auditScope') ?: 'all'
    def mode = rootProject.findProperty('auditMode') ?: 'fast'
    def useCompat = (rootProject.findProperty('compat') ?: 'false').toBoolean()
    if (!(scope in ['all', 'ui', 'engine', 'inventory', 'selected']) || !(mode in ['fast', 'precise'])) {
        throw new GradleException('Unknown auditScope or auditMode')
    }
    def output = new File(rootProject.projectDir, "build/teavm-audit/${mode}-${scope}" + (useCompat ? '-compat' : ''))
    def inventory = new File(rootProject.projectDir, 'build/teavm-audit/inventory')
    def compile = rootProject.tasks.register('compileTeaVMAudit', JavaCompile) {
        dependsOn app.tasks.named('classes')
        source new File(harness, 'src')
        classpath = auditDependencies
        destinationDirectory = classes
        javaCompiler = app.tasks.named('compileJava').flatMap { it.javaCompiler }
        options.release = 17
        sourceCompatibility = '17'
        targetCompatibility = '17'
        options.encoding = 'UTF-8'
    }
    def runtime = rootProject.files(classes) + auditDependencies + app.sourceSets.main.runtimeClasspath
    def compat = new File(rootProject.projectDir, 'wasm-compat')
    def compatClasses = new File(rootProject.projectDir, 'build/wasm-compat/classes')
    def compatTests = new File(rootProject.projectDir, 'build/wasm-compat/test-classes')
    def probeOutput = new File(rootProject.projectDir, 'build/wasm-compat/probe')
    rootProject.tasks.register('compileWasmCompatibility', JavaCompile) {
        source new File(compat, 'src/main/java')
        classpath = auditDependencies
        destinationDirectory = compatClasses
        javaCompiler = app.tasks.named('compileJava').flatMap { it.javaCompiler }
        sourceCompatibility = '17'; targetCompatibility = '17'; options.release = 17
        options.encoding = 'UTF-8'
    }
    rootProject.tasks.register('copyWasmCompatibilityResources', Copy) {
        dependsOn 'compileWasmCompatibility'
        from new File(compat, 'src/main/resources')
        into compatClasses
    }
    def compatRuntime = rootProject.files(compatClasses) + runtime
    rootProject.tasks.register('compileWasmCompatibilityTests', JavaCompile) {
        dependsOn 'copyWasmCompatibilityResources'
        source new File(compat, 'src/test/java')
        classpath = rootProject.files(compatClasses) + auditDependencies
        destinationDirectory = compatTests
        javaCompiler = app.tasks.named('compileJava').flatMap { it.javaCompiler }
        sourceCompatibility = '17'; targetCompatibility = '17'; options.release = 17
        options.encoding = 'UTF-8'
    }
    rootProject.tasks.register('testWasmCompatibilityJvm', JavaExec) {
        dependsOn compile, 'compileWasmCompatibilityTests'
        classpath = rootProject.files(compatTests) + compatRuntime
        mainClass = 'org.audiveris.wasm.compat.test.OracleTest'
        maxHeapSize = '384m'
        systemProperty 'java.awt.headless', 'true'
        args new File(probeOutput, 'oracle.json').absolutePath
        doFirst { probeOutput.mkdirs() }
    }
    rootProject.tasks.register('buildCompatibilityProbe', JavaExec) {
        dependsOn compile, 'testWasmCompatibilityJvm'
        classpath = rootProject.files(compatTests) + compatRuntime
        mainClass = 'audit.CompileCompatibilityProbe'
        maxHeapSize = '1g'
        systemProperty 'audiveris.compat.enabled', 'true'
        args probeOutput.absolutePath
    }
    rootProject.tasks.register('verifyWasmCompatibility', Exec) {
        dependsOn 'buildCompatibilityProbe'
        commandLine 'node', '--max-old-space-size=256', new File(compat, 'tools/verify-probe.cjs').absolutePath, probeOutput.absolutePath
    }
    rootProject.tasks.register('verifyWasmCompatibilityBrowser', Exec) {
        dependsOn 'verifyWasmCompatibility'
        commandLine 'node', '--max-old-space-size=256', new File(compat, 'tools/verify-browser.cjs').absolutePath, probeOutput.absolutePath
    }
    def applicationClasses = app.tasks.named('compileJava').get().destinationDirectory.get().asFile.absolutePath
    rootProject.tasks.register('inventoryTeaVMAudit', JavaExec) {
        dependsOn compile
        classpath = runtime
        mainClass = 'audit.TeaVMAudit'
        maxHeapSize = '2g'
        args applicationClasses, inventory.absolutePath, 'inventory', 'fast'
        systemProperty 'logback.configurationFile', new File(harness, 'logback.xml').absolutePath
    }
    rootProject.tasks.register('classifyTeaVMInventory', Exec) {
        dependsOn 'inventoryTeaVMAudit'
        commandLine 'python3', new File(harness, 'classify_classes.py').absolutePath,
                applicationClasses, new File(app.projectDir, 'src/main/java').absolutePath, inventory.absolutePath
    }
    rootProject.tasks.register('testTeaVMSelection', Exec) {
        workingDir harness
        commandLine 'python3', '-m', 'unittest', '-v', 'test_selection.py'
        environment 'PYTHONDONTWRITEBYTECODE', '1'
    }
    rootProject.tasks.register('prepareTeaVMSelection', Exec) {
        dependsOn 'classifyTeaVMInventory', 'testTeaVMSelection'
        commandLine 'python3', new File(harness, 'select_roots.py').absolutePath,
                inventory.absolutePath, new File(harness, 'root-policy.json').absolutePath, output.absolutePath
    }
    rootProject.tasks.register('auditTeaVM', JavaExec) {
        dependsOn compile
        if (scope == 'selected') { dependsOn 'prepareTeaVMSelection' }
        if (useCompat) { dependsOn 'copyWasmCompatibilityResources', 'verifyWasmCompatibility' }
        classpath = useCompat ? compatRuntime : runtime
        mainClass = 'audit.TeaVMAudit'
        maxHeapSize = '5g'
        jvmArgs '-XX:MaxMetaspaceSize=512m', '-XX:ActiveProcessorCount=3'
        args applicationClasses, output.absolutePath, scope, mode
        if (scope == 'selected') { args new File(output, 'root-plan.tsv').absolutePath }
        systemProperty 'org.slf4j.simpleLogger.defaultLogLevel', 'warn'
        systemProperty 'logback.configurationFile', new File(harness, 'logback.xml').absolutePath
        systemProperty 'audiveris.compat.enabled', useCompat.toString()
    }
    if (scope == 'selected') {
        rootProject.tasks.register('classifyTeaVMClasses') { dependsOn 'auditTeaVM' }
    } else {
        rootProject.tasks.register('classifyTeaVMClasses', Exec) {
            dependsOn 'auditTeaVM'
            commandLine 'python3', new File(harness, 'classify_classes.py').absolutePath,
                    applicationClasses, new File(app.projectDir, 'src/main/java').absolutePath, output.absolutePath
        }
    }
    rootProject.tasks.register('summarizeTeaVMAudit', Exec) {
        dependsOn 'classifyTeaVMClasses'
        commandLine 'python3', new File(harness, 'summarize.py').absolutePath, output.absolutePath
    }
    rootProject.tasks.register('traceTeaVMExclusions', Exec) {
        dependsOn 'summarizeTeaVMAudit'
        doFirst {
            if (scope != 'selected') { throw new GradleException('Use -PauditScope=selected to trace exclusion paths') }
        }
        commandLine 'python3', new File(harness, 'trace_exclusions.py').absolutePath,
                output.absolutePath, inventory.absolutePath,
                new File(harness, 'results/diagnostic-summary.json').absolutePath
        if ((rootProject.findProperty('failOnExcluded') ?: 'false').toBoolean()) { args '--fail-on-excluded' }
    }
    rootProject.tasks.register('compareWasmCompatibilityAudit', Exec) {
        dependsOn 'summarizeTeaVMAudit'
        doFirst {
            if (!useCompat || scope != 'selected') { throw new GradleException('Use -PauditScope=selected -Pcompat=true; run the unpatched selected audit first') }
        }
        commandLine 'python3', new File(harness, 'compare_compat.py').absolutePath,
                new File(rootProject.projectDir, "build/teavm-audit/${mode}-selected").absolutePath, output.absolutePath
    }
}

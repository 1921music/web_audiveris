        def gridOutput = new File(rootProject.projectDir, 'build/wasm-compat/clean-grid-probe')
        classpath = rootProject.files(scaleClasses, new File(rootProject.projectDir, "build/wasm-compat/upstream-bracket/classes"), compatTests, compatClasses) + app.sourceSets.main.runtimeClasspath
        mainClass = 'org.audiveris.wasm.compat.test.GridOracle'
        workingDir app.projectDir
        maxHeapSize = '768m'

        environment 'XDG_CONFIG_HOME', new File(gridOutput, 'jvm-config').absolutePath
        environment 'XDG_DATA_HOME', new File(gridOutput, 'jvm-data').absolutePath
        environment 'XDG_CACHE_HOME', new File(gridOutput, 'jvm-cache').absolutePath
        args new File(pixelProbeOutput, 'samples').absolutePath, new File(gridOutput, 'jvm-reference.json').absolutePath, scaleClasses.absolutePath, new File(rootProject.projectDir, 'build/wasm-compat/upstream-bracket/classes').absolutePath, 'complete'

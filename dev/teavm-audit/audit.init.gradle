// Audits original application bytecode; optional platform substitutions live in wasm-compat.
gradle.projectsEvaluated {
    def app = rootProject.findProject(':app')
    if (app == null) { return }
    def auditDependencies = rootProject.configurations.create('teavmAuditDependencies')
    def compatDependencies = rootProject.configurations.create('wasmCompatibilityDependencies')
    def patchToolDependencies = rootProject.configurations.create('wasmPatchToolDependencies')
    rootProject.repositories { mavenCentral() }
    rootProject.dependencies {
        teavmAuditDependencies 'org.teavm:teavm-tooling:0.16.0'
        teavmAuditDependencies 'org.teavm:teavm-classlib:0.16.0'
        teavmAuditDependencies 'org.teavm:teavm-jso:0.16.0'
        teavmAuditDependencies 'org.teavm:teavm-jso-impl:0.16.0'
        wasmCompatibilityDependencies 'net.sf.kxml:kxml2:2.3.0'
        wasmPatchToolDependencies 'org.ow2.asm:asm:9.9.1'
    }
    def harness = new File(rootProject.projectDir, 'dev/teavm-audit')
    def classes = rootProject.layout.buildDirectory.dir('teavm-audit/classes')
    def scope = rootProject.findProperty('auditScope') ?: 'all'
    def mode = rootProject.findProperty('auditMode') ?: 'fast'
    def useCompat = (rootProject.findProperty('compat') ?: 'false').toBoolean()
    def useHeadless = (rootProject.findProperty('headless') ?: 'false').toBoolean()
    if (useHeadless && !useCompat) { throw new GradleException('headless requires -Pcompat=true') }
    def xmlBackend = rootProject.findProperty('xmlBackend') ?: 'kxml2'
    if (!(xmlBackend in ['kxml2', 'jdk'])) { throw new GradleException('xmlBackend must be kxml2 or jdk') }
    if (!(scope in ['all', 'ui', 'engine', 'inventory', 'selected']) || !(mode in ['fast', 'precise'])) {
        throw new GradleException('Unknown auditScope or auditMode')
    }
    def output = new File(rootProject.projectDir, "build/teavm-audit/${mode}-${scope}" + (useCompat ? '-compat' : '') + (useHeadless ? '-headless' : ''))
    def inventory = new File(rootProject.projectDir, 'build/teavm-audit/inventory')
    def compile = rootProject.tasks.register('compileTeaVMAudit', JavaCompile) {
        dependsOn app.tasks.named('classes')
        source new File(harness, 'src')
        classpath = auditDependencies + patchToolDependencies
        destinationDirectory = classes
        javaCompiler = app.tasks.named('compileJava').flatMap { it.javaCompiler }
        options.release = 17
        sourceCompatibility = '17'
        targetCompatibility = '17'
        options.encoding = 'UTF-8'
    }
    def runtime = rootProject.files(classes) + auditDependencies + app.sourceSets.main.runtimeClasspath
    def compat = new File(rootProject.projectDir, 'wasm-compat')
    def compatClasses = new File(rootProject.projectDir, 'build/wasm-compat/classes')
    def compatBaseClasses = new File(rootProject.projectDir, 'build/wasm-compat/upstream-base')
    def patchedKxml = new File(rootProject.projectDir, 'build/wasm-compat/kxml2-patched')
    rootProject.tasks.register('patchKxmlCompatibility', JavaExec) {
        dependsOn compile
        classpath = rootProject.files(classes) + auditDependencies + patchToolDependencies
        mainClass = 'audit.PatchKxml2'
        maxHeapSize = '128m'
        inputs.files compatDependencies
        outputs.dir patchedKxml
        doFirst { args compatDependencies.singleFile.absolutePath, patchedKxml.absolutePath }
    }
    def compatTests = new File(rootProject.projectDir, 'build/wasm-compat/test-classes')
    def probeOutput = new File(rootProject.projectDir, 'build/wasm-compat/' + (xmlBackend == 'jdk' ? 'probe-jdk' : 'probe'))
    def bundledResources = new File(rootProject.projectDir, 'build/wasm-compat/bundled-resources')
    def musicData = new File(rootProject.projectDir, 'build/wasm-compat/music-data')
    rootProject.tasks.register('generateWasmMusicData', Exec) {
        inputs.file(new File(compat, 'tools/generate-music-data.py'))
        for (name in ['glyph/ShapeSet.java', 'ui/symbol/BravuraSymbols.java', 'ui/field/MusicPane.java', 'ui/symbol/Symbols.java', 'sheet/ui/TemplateView.java', 'ui/util/UIUtil.java', 'Main.java']) {
            inputs.file(new File(app.projectDir, 'src/main/java/org/audiveris/omr/' + name))
        }
        outputs.dir musicData
        commandLine 'python3', new File(compat, 'tools/generate-music-data.py').absolutePath, rootProject.projectDir.absolutePath, musicData.absolutePath
    }
    rootProject.tasks.register('generateWasmResources', Exec) {
        inputs.file(new File(compat, 'resources.json'))
        inputs.file(new File(compat, 'tools/generate-resources.py'))
        inputs.files(new File(rootProject.projectDir, 'app/res'), new File(compat, 'src/test/resources'))
        outputs.dir bundledResources
        commandLine 'python3', new File(compat, 'tools/generate-resources.py').absolutePath,
                rootProject.projectDir.absolutePath, bundledResources.absolutePath
    }
    rootProject.tasks.register('compileWasmCompatibility', JavaCompile) {
        dependsOn 'generateWasmResources', 'generateWasmMusicData'
        source new File(compat, 'src/main/java')
        source new File(bundledResources, 'src')
        source new File(musicData, 'src')
        classpath = auditDependencies + compatDependencies + app.sourceSets.main.runtimeClasspath
        destinationDirectory = compatClasses
        javaCompiler = app.tasks.named('compileJava').flatMap { it.javaCompiler }
        sourceCompatibility = '17'; targetCompatibility = '17'; options.release = 17
        options.encoding = 'UTF-8'
    }
    rootProject.tasks.register('copyWasmCompatibilityResources', Copy) {
        dependsOn 'compileWasmCompatibility'
        from new File(compat, 'src/main/resources')
        into compatClasses
    }
    // The library ships equivalent Java 8 implementations: choose those instead of MR-JAR
    // implementations requiring VarHandles, FMA or newer high-multiply intrinsics.
    rootProject.tasks.register('selectWasmLibraryImplementations', Sync) {
        from {
            def jar = app.sourceSets.main.runtimeClasspath.files.find { it.name == 'jackson-core-2.20.0.jar' }
            if (jar == null) { throw new GradleException('Expected pinned jackson-core 2.20.0') }
            zipTree(jar)
        }
        include 'com/fasterxml/jackson/core/internal/shaded/fdp/v2_20_0/BigSignificand.class'
        include 'com/fasterxml/jackson/core/internal/shaded/fdp/v2_20_0/FastDoubleSwar.class'
        include 'com/fasterxml/jackson/core/internal/shaded/fdp/v2_20_0/FastIntegerMath.class'
        into compatBaseClasses
    }
    def compatRuntime = rootProject.files(compatClasses, compatBaseClasses, patchedKxml, new File(bundledResources, 'classpath')) + compatDependencies + runtime
    rootProject.tasks.register('compileWasmCompatibilityTests', JavaCompile) {
        dependsOn 'copyWasmCompatibilityResources'
        source new File(compat, 'src/test/java')
        classpath = rootProject.files(compatClasses) + auditDependencies + compatDependencies + app.sourceSets.main.runtimeClasspath
        destinationDirectory = compatTests
        javaCompiler = app.tasks.named('compileJava').flatMap { it.javaCompiler }
        sourceCompatibility = '25'; targetCompatibility = '25'; options.release = 25
        options.encoding = 'UTF-8'
    }
    rootProject.tasks.register('testWasmCompatibilityJvm', JavaExec) {
        dependsOn compile, 'compileWasmCompatibilityTests', 'patchKxmlCompatibility'
        classpath = rootProject.files(compatTests, compatClasses, patchedKxml, new File(bundledResources, 'classpath')) + compatDependencies + runtime
        mainClass = 'org.audiveris.wasm.compat.test.OracleTest'
        maxHeapSize = '384m'
        jvmArgs '--add-exports=java.base/jdk.internal.util=ALL-UNNAMED'
        systemProperty 'java.awt.headless', 'true'
        args new File(probeOutput, 'oracle.json').absolutePath
        doFirst { probeOutput.mkdirs() }
    }
    rootProject.tasks.register('buildCompatibilityProbe', JavaExec) {
        dependsOn compile, 'testWasmCompatibilityJvm', 'selectWasmLibraryImplementations'
        classpath = rootProject.files(compatTests) + compatRuntime
        mainClass = 'audit.CompileCompatibilityProbe'
        maxHeapSize = '1g'
        systemProperty 'audiveris.compat.enabled', 'true'
        systemProperty 'audiveris.compat.reflectionClasses', 'org.audiveris.wasm.compat.test.UtilityProbe$DefaultMethods,org.audiveris.wasm.compat.test.ResourceProbe$LookupFixture'
        systemProperty 'audiveris.compat.probeGC', 'true'
        systemProperty 'audiveris.compat.xmlBackend', xmlBackend
        args probeOutput.absolutePath
    }
    rootProject.tasks.register('verifyWasmCompatibility', Exec) {
        dependsOn 'buildCompatibilityProbe'
        commandLine 'node', '--max-old-space-size=256', new File(compat, 'tools/verify-probe.cjs').absolutePath, probeOutput.absolutePath
    }
    rootProject.tasks.register('buildXmlBenchmark', JavaExec) {
        dependsOn compile, 'compileWasmCompatibilityTests', 'patchKxmlCompatibility', 'selectWasmLibraryImplementations'
        classpath = rootProject.files(compatTests) + compatRuntime
        mainClass = 'audit.CompileCompatibilityProbe'
        maxHeapSize = '1g'
        systemProperty 'audiveris.compat.enabled', 'true'
        systemProperty 'audiveris.compat.xmlBackend', xmlBackend
        args new File(rootProject.projectDir, "build/wasm-compat/xml-bench-${xmlBackend}").absolutePath,
                'org.audiveris.wasm.compat.test.XmlBenchmark', 'xml'
    }
    def headlessProbeOutput = new File(rootProject.projectDir, 'build/wasm-compat/headless-probe')
    rootProject.tasks.register('testHeadlessTransformsJvm', JavaExec) {
        dependsOn 'compileWasmCompatibilityTests'
        classpath = rootProject.files(compatTests, compatClasses) + auditDependencies + app.sourceSets.main.runtimeClasspath
        mainClass = 'org.audiveris.wasm.compat.InheritedUiFieldTest'
        maxHeapSize = '768m'
        args new File(headlessProbeOutput, 'model-verification.json').absolutePath
        doFirst { headlessProbeOutput.mkdirs() }
    }
    rootProject.tasks.register('testHeadlessSchedulingJvm', JavaExec) {
        dependsOn 'compileWasmCompatibilityTests'
        classpath = rootProject.files(compatTests, compatClasses)
        mainClass = 'org.audiveris.wasm.compat.test.SerialExecutorTest'
        maxHeapSize = '256m'
        systemProperty 'java.awt.headless', 'true'
        args new File(headlessProbeOutput, 'jvm-verification.json').absolutePath
        doFirst { headlessProbeOutput.mkdirs() }
    }
    rootProject.tasks.register('buildHeadlessProbe', JavaExec) {
        dependsOn compile, 'testHeadlessSchedulingJvm', 'testHeadlessTransformsJvm', 'patchKxmlCompatibility', 'selectWasmLibraryImplementations'
        classpath = rootProject.files(compatTests) + compatRuntime
        mainClass = 'audit.CompileCompatibilityProbe'
        maxHeapSize = '1g'
        systemProperty 'audiveris.compat.enabled', 'true'
        systemProperty 'audiveris.compat.headless', 'true'
        systemProperty 'audiveris.compat.headlessReport', new File(headlessProbeOutput, 'modified-methods.tsv').absolutePath
        args headlessProbeOutput.absolutePath, 'org.audiveris.wasm.compat.test.HeadlessProbe', 'headless'
    }
    rootProject.tasks.register('verifyHeadlessProbe', Exec) {
        dependsOn 'buildHeadlessProbe'
        commandLine 'node', '--max-old-space-size=256', new File(compat, 'tools/verify-headless.cjs').absolutePath, headlessProbeOutput.absolutePath
    }
    rootProject.tasks.register('verifyWasmCompatibilityBrowser', Exec) {
        dependsOn 'verifyWasmCompatibility'
        commandLine 'node', '--max-old-space-size=256', new File(compat, 'tools/verify-browser.cjs').absolutePath, probeOutput.absolutePath
    }
    def applicationClasses = app.tasks.named('compileJava').get().destinationDirectory.get().asFile.absolutePath
    rootProject.tasks.register('inventoryTeaVMAudit', JavaExec) {
        dependsOn compile
        classpath = runtime
        mainClass = 'audit.TeaVMAudit'
        maxHeapSize = '2g'
        args applicationClasses, inventory.absolutePath, 'inventory', 'fast'
        systemProperty 'logback.configurationFile', new File(harness, 'logback.xml').absolutePath
    }
    rootProject.tasks.register('classifyTeaVMInventory', Exec) {
        dependsOn 'inventoryTeaVMAudit'
        commandLine 'python3', new File(harness, 'classify_classes.py').absolutePath,
                applicationClasses, new File(app.projectDir, 'src/main/java').absolutePath, inventory.absolutePath
    }
    rootProject.tasks.register('testTeaVMSelection', Exec) {
        workingDir harness
        commandLine 'python3', '-m', 'unittest', '-v', 'test_selection.py'
        environment 'PYTHONDONTWRITEBYTECODE', '1'
    }
    rootProject.tasks.register('prepareTeaVMSelection', Exec) {
        dependsOn 'classifyTeaVMInventory', 'testTeaVMSelection'
        commandLine 'python3', new File(harness, 'select_roots.py').absolutePath,
                inventory.absolutePath, new File(harness, 'root-policy.json').absolutePath, output.absolutePath
    }
    rootProject.tasks.register('auditTeaVM', JavaExec) {
        dependsOn compile
        if (scope == 'selected') { dependsOn 'prepareTeaVMSelection' }
        if (useCompat) { dependsOn 'copyWasmCompatibilityResources', 'verifyWasmCompatibility', 'selectWasmLibraryImplementations' }
        if (useHeadless) { dependsOn 'verifyHeadlessProbe' }
        classpath = useCompat ? compatRuntime : runtime
        mainClass = 'audit.TeaVMAudit'
        maxHeapSize = '5g'
        jvmArgs '-XX:MaxMetaspaceSize=512m', '-XX:ActiveProcessorCount=8'
        args applicationClasses, output.absolutePath, scope, mode
        if (scope == 'selected') { args new File(output, 'root-plan.tsv').absolutePath }
        systemProperty 'org.slf4j.simpleLogger.defaultLogLevel', 'warn'
        systemProperty 'logback.configurationFile', new File(harness, 'logback.xml').absolutePath
        systemProperty 'audiveris.compat.enabled', useCompat.toString()
        systemProperty 'audiveris.compat.headless', useHeadless.toString()
        if (useHeadless) { systemProperty 'audiveris.compat.headlessReport', new File(output, 'modified-methods.tsv').absolutePath }
        systemProperty 'audiveris.compat.xmlBackend', xmlBackend
    }
    if (scope == 'selected') {
        rootProject.tasks.register('classifyTeaVMClasses') { dependsOn 'auditTeaVM' }
    } else {
        rootProject.tasks.register('classifyTeaVMClasses', Exec) {
            dependsOn 'auditTeaVM'
            commandLine 'python3', new File(harness, 'classify_classes.py').absolutePath,
                    applicationClasses, new File(app.projectDir, 'src/main/java').absolutePath, output.absolutePath
        }
    }
    rootProject.tasks.register('summarizeTeaVMAudit', Exec) {
        dependsOn 'classifyTeaVMClasses'
        commandLine 'python3', new File(harness, 'summarize.py').absolutePath, output.absolutePath
    }
    rootProject.tasks.register('traceTeaVMExclusions', Exec) {
        dependsOn 'summarizeTeaVMAudit'
        doFirst {
            if (scope != 'selected') { throw new GradleException('Use -PauditScope=selected to trace exclusion paths') }
        }
        commandLine 'python3', new File(harness, 'trace_exclusions.py').absolutePath,
                output.absolutePath, inventory.absolutePath,
                new File(harness, 'results/diagnostic-summary.json').absolutePath
        if ((rootProject.findProperty('failOnExcluded') ?: 'false').toBoolean()) { args '--fail-on-excluded' }
    }
    rootProject.tasks.register('compareWasmCompatibilityAudit', Exec) {
        dependsOn 'summarizeTeaVMAudit'
        doFirst {
            if (!useCompat || scope != 'selected') { throw new GradleException('Use -PauditScope=selected -Pcompat=true; run the unpatched selected audit first') }
        }
        commandLine 'python3', new File(harness, 'compare_compat.py').absolutePath,
                new File(rootProject.projectDir, "build/teavm-audit/${mode}-selected").absolutePath, output.absolutePath
    }
}

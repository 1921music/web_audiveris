// Use together with audit.init.gradle; this task observes native painting without substitutions.
gradle.projectsEvaluated {
    def app = rootProject.findProject(':app')
    if (app == null) { return }
    rootProject.tasks.register('testMusicSymbolsJvm', JavaExec) {
        dependsOn 'compileWasmCompatibilityTests'
        classpath = rootProject.files('build/wasm-compat/test-classes') + app.sourceSets.main.runtimeClasspath
        mainClass = 'org.audiveris.wasm.compat.test.MusicSymbolOracle'
        jvmArgs '--add-exports=java.desktop/sun.font=ALL-UNNAMED','--add-opens=java.desktop/sun.font=ALL-UNNAMED'
        maxHeapSize = '512m'
        workingDir app.projectDir
        systemProperty 'java.awt.headless', 'true'
        args new File(rootProject.projectDir,'build/wasm-compat/music-symbols-native').absolutePath
    }
    rootProject.tasks.register('buildMusicSymbolsWasm', Exec) {
        dependsOn 'testMusicSymbolsJvm','buildMusicMetricsWasm'
        commandLine 'python3',new File(rootProject.projectDir,'dev/teavm-audit/build_music_symbols_wasm.py').absolutePath,rootProject.projectDir.absolutePath
    }
    rootProject.tasks.register('verifyMusicSymbolsWasm', Exec) {
        dependsOn 'buildMusicSymbolProbe','buildMusicSymbolsWasm'
        commandLine 'node','--max-old-space-size=768','--v8-pool-size=1',new File(rootProject.projectDir,'wasm-compat/tools/verify-music-symbols.cjs').absolutePath,
                new File(rootProject.projectDir,'build/wasm-compat/music-symbols-wasm').absolutePath
    }
    rootProject.tasks.named('verifyMusicBackedTextsProbe').configure { dependsOn 'buildMusicSymbolsWasm' }
    rootProject.tasks.register('traceMusicPainting', JavaExec) {
        dependsOn 'compileWasmCompatibilityTests'
        classpath = rootProject.files('build/wasm-compat/test-classes') + app.sourceSets.main.runtimeClasspath
        mainClass = 'org.audiveris.wasm.compat.test.MusicPaintTrace'
        maxHeapSize = '256m'
        workingDir app.projectDir
        systemProperty 'java.awt.headless', 'true'
        args new File(rootProject.projectDir, 'build/wasm-compat/music-paint-trace').absolutePath
    }
    rootProject.tasks.register('buildNativeMusicMaskHelper', Exec) {
        commandLine 'python3', new File(rootProject.projectDir, 'dev/teavm-audit/prepare_music_mask_native.py').absolutePath,
                rootProject.projectDir.absolutePath
    }
    rootProject.tasks.register('traceMusicMasks', JavaExec) {
        dependsOn 'compileWasmCompatibilityTests', 'buildNativeMusicMaskHelper'
        classpath = rootProject.files('build/wasm-compat/test-classes') + app.sourceSets.main.runtimeClasspath
        mainClass = 'org.audiveris.wasm.compat.test.MusicMaskTrace'
        maxHeapSize = '256m'
        workingDir app.projectDir
        systemProperty 'java.awt.headless', 'true'
        args new File(rootProject.projectDir, 'build/wasm-compat/freetype-native/libmusic-mask.so').absolutePath,
                new File(rootProject.projectDir, 'build/wasm-compat/music-mask-trace').absolutePath
    }
    rootProject.tasks.register('buildMusicMaskWasm', Exec) {
        dependsOn 'traceMusicMasks'
        commandLine 'python3', new File(rootProject.projectDir, 'dev/teavm-audit/build_music_mask_wasm.py').absolutePath,
                rootProject.projectDir.absolutePath
    }
    rootProject.tasks.register('verifyMusicMaskWasm', Exec) {
        dependsOn 'buildMusicMaskWasm'
        commandLine 'node', '--max-old-space-size=512', new File(rootProject.projectDir, 'wasm-compat/tools/verify-music-masks.cjs').absolutePath,
                new File(rootProject.projectDir, 'build/wasm-compat/music-mask-wasm').absolutePath
    }
    rootProject.tasks.register('buildNativeMusicMetricsHelper', Exec) {
        commandLine 'python3', new File(rootProject.projectDir, 'dev/teavm-audit/prepare_music_metrics_native.py').absolutePath,
                rootProject.projectDir.absolutePath
    }
    rootProject.tasks.register('testMusicMetricsJvm', JavaExec) {
        dependsOn 'compileWasmCompatibilityTests', 'buildNativeMusicMetricsHelper'
        classpath = rootProject.files('build/wasm-compat/test-classes') + app.sourceSets.main.runtimeClasspath
        mainClass = 'org.audiveris.wasm.compat.test.MusicMetricsOracle'
        maxHeapSize = '512m'
        workingDir app.projectDir
        systemProperty 'java.awt.headless', 'true'
        args new File(rootProject.projectDir, 'build/wasm-compat/freetype-native/libmusic-metrics.so').absolutePath,
                new File(rootProject.projectDir, 'build/wasm-compat/music-metrics-native').absolutePath
    }
    rootProject.tasks.register('buildMusicMetricsWasm', Exec) {
        dependsOn 'testMusicMetricsJvm','buildMusicMaskWasm'
        commandLine 'python3', new File(rootProject.projectDir, 'dev/teavm-audit/build_music_metrics_wasm.py').absolutePath,
                rootProject.projectDir.absolutePath
    }
    rootProject.tasks.register('verifyMusicMetricsWasm', Exec) {
        dependsOn 'buildMusicMetricsWasm'
        commandLine 'node', '--max-old-space-size=512', new File(rootProject.projectDir, 'wasm-compat/tools/verify-music-metrics.cjs').absolutePath,
                new File(rootProject.projectDir, 'build/wasm-compat/music-metrics-wasm').absolutePath
    }
}

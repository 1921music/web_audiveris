        args new File(rootProject.projectDir,'build/wasm-engine/engine').absolutePath,
            'org.audiveris.wasm.compat.platform.WorkerEngine','engine'
    }
    rootProject.tasks.register('buildEngineResourcesProbe',JavaExec) {
        def base=rootProject.tasks.named('buildPageRecognitionProbe',JavaExec).get()
        dependsOn 'compileTeaVMAudit','compileWasmCompatibilityTests','patchKxmlCompatibility','selectWasmLibraryImplementations'
        classpath=base.classpath;systemProperties base.systemProperties;maxHeapSize='2g'
        mainClass='audit.CompileCompatibilityProbe'
        args new File(rootProject.projectDir,'build/wasm-engine/resources-probe').absolutePath,
            'org.audiveris.wasm.compat.test.EngineResourcesProbe','resources'
    }
}

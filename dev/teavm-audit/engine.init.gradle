        mainClass='org.audiveris.wasm.compat.test.FontResourceOracle'
        maxHeapSize='768m';workingDir app.projectDir
        systemProperty 'java.awt.headless','true'
        args new File(rootProject.projectDir,'build/wasm-engine/font-data').absolutePath
    }
    rootProject.tasks.register('buildEngineFontBackend',Exec) {
        dependsOn 'buildEngineMusicDefinitions'
        commandLine 'python3',new File(rootProject.projectDir,'dev/teavm-audit/build_engine_fonts.py').absolutePath,
            rootProject.projectDir.absolutePath
    }
    rootProject.tasks.register('buildEngineMusicDefinitions',JavaExec) {
        dependsOn 'compileWasmCompatibilityTests','compileTeaVMAudit','patchKxmlCompatibility','selectWasmLibraryImplementations'
        classpath=rootProject.tasks.named('testPageRecognitionJvm',JavaExec).get().classpath
        mainClass='org.audiveris.wasm.compat.test.MusicSymbolOracle'
        maxHeapSize='768m';workingDir app.projectDir;systemProperty 'java.awt.headless','true'
        jvmArgs '--add-exports=java.desktop/sun.font=ALL-UNNAMED','--add-opens=java.desktop/sun.font=ALL-UNNAMED'
        args new File(rootProject.projectDir,'build/wasm-engine/music-definitions').absolutePath,'--assets-only'
    }
    rootProject.tasks.register('testTemplateRasterBoundaryJvm',JavaExec) {
        dependsOn 'compileWasmCompatibilityTests','compileTeaVMAudit','patchKxmlCompatibility','selectWasmLibraryImplementations'
        classpath=rootProject.tasks.named('testPageRecognitionJvm',JavaExec).get().classpath
        mainClass='org.audiveris.wasm.compat.test.TemplateRasterBoundaryOracle'
        maxHeapSize='768m';workingDir app.projectDir;systemProperty 'java.awt.headless','true'
        args new File(rootProject.projectDir,'build/wasm-compat/template-original-probe').absolutePath,
            new File(rootProject.projectDir,'build/wasm-engine/template-reference').absolutePath
    }
    rootProject.tasks.register('buildWorkerEngine',JavaExec) {
        def base=rootProject.tasks.named('buildPageRecognitionProbe',JavaExec).get()

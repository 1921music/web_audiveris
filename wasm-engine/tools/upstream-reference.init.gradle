// Run the full upstream JVM pipeline on the exact same decoded grayscale inputs.
gradle.projectsEvaluated {
    def app = rootProject.findProject(':app')
    if (app == null) { return }
    def fixtureDir = new File(rootProject.projectDir, 'wasm-engine/build/sample-reference')
    def manifestFile = new File(fixtureDir, 'manifest.json')
    def toolClasses = new File(rootProject.projectDir, 'wasm-engine/build/upstream-tools')
    def compileTools = rootProject.tasks.register('compileUpstreamTools', JavaCompile) {
        dependsOn app.tasks.named('classes')
        source new File(rootProject.projectDir, 'wasm-engine/tools/UpstreamRunReference.java')
        classpath = app.sourceSets.main.runtimeClasspath
        destinationDirectory = toolClasses
        sourceCompatibility = '25'
        targetCompatibility = '25'
        javaCompiler = app.tasks.named('compileJava').flatMap { it.javaCompiler }
        options.encoding = 'UTF-8'
    }
    rootProject.tasks.register('upstreamRunReference', JavaExec) {
        dependsOn compileTools
        classpath = app.sourceSets.main.runtimeClasspath + rootProject.files(toolClasses)
        mainClass = 'UpstreamRunReference'
        systemProperty 'logback.configurationFile', new File(rootProject.projectDir, 'wasm-engine/tools/reference-logback.xml').absolutePath
        workingDir = app.projectDir
        maxHeapSize = '512m'
        args fixtureDir.absolutePath
    }
    rootProject.tasks.register('upstreamReference', JavaExec) {
        dependsOn app.tasks.named('classes')
        classpath = app.sourceSets.main.runtimeClasspath
        mainClass = 'Audiveris'
        workingDir = app.projectDir
        maxHeapSize = '768m'
        jvmArgs app.application.applicationDefaultJvmArgs
        systemProperty 'java.awt.headless', 'true'
        doFirst {
            def samples = new groovy.json.JsonSlurper().parse(manifestFile)
            def inputs = samples.findAll { it.portableScale != null }.collect {
                new File(fixtureDir, "${it.id}.input.png").absolutePath
            }
            if (inputs.isEmpty()) { throw new GradleException('No successful scale fixtures; run verifySamples first') }
            args '-batch', '-save', '-step', rootProject.findProperty('referenceStep') ?: 'SCALE',
                '-output', new File(rootProject.projectDir, 'wasm-engine/build/upstream-reference').absolutePath,
                '--'
            args inputs
        }
    }
}
